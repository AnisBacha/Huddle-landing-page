<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="header">
    <img class="header__logo" src="./images/logo.svg" alt="logo">
  </header>
  <main class="main">
    <img class="main__illustration" src="./images/illustration-mockups.svg" alt="illustration-mockups">
    <section >
      <h1 class="main__h1">Build The Community Your Fans Will Love</h1>
    
      <p class="main__p">Huddle re-imagines the way we build communities. You have a voice, but so does your audience. Create connections with your users as you engage in genuine discussion.</p>
    
      <button class="main__button">Register</button>
  
      <div>
        <img src="./images/icon-facebook.svg" alt="icon-facebook">
        <img src="./images/icon-twitter.svg" alt="icon-twitter">
        <img src="./images/icon-pinterest.svg" alt="icon-pinterest">
        
      </div>
    </section>
  </main>

</body>
</html>
